<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Webbitar</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/Webbitar_Favicon_512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.nf{min-height:55vh;display:flex;align-items:center;text-align:center}
.nf .code{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:.34em;text-transform:uppercase;margin-bottom:20px}
.nf h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,6vw,72px);line-height:1.05;margin-bottom:18px}
.nf h1 em{font-style:italic}
.nf p{max-width:48ch;margin:0 auto 32px;color:var(--muted);font-size:17px}
.nf .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body data-page="">

<main>
  <section class="nf">
    <div class="wrap">
      <div class="code">404 — Not Found</div>
      <h1>This page has gone <em>missing</em>.</h1>
      <p>The address may have changed, or the page no longer exists. Let's get you back somewhere useful. / Sidan du letar efter finns inte längre.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Back to the homepage</a>
        <a href="/contact" class="btn btn-ghost">Contact us</a>
      </div>
    </div>
  </section>
</main>

<script src="/site.js"></script>
</body>
</html>
